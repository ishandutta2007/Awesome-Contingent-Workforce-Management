<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0d1117"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><radialGradient id="glowLeft" cx="20%" cy="30%" r="50%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".35"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient><radialGradient id="glowRight" cx="80%" cy="70%" r="55%"><stop offset="0%" stop-color="#0ea5e9" stop-opacity=".3"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".35" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".6" stdDeviation="12"/></filter><filter id="textGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatOrb1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-25px) scale(1.15)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-35px,30px) scale(.9)}}@keyframes dashCycle{0%{stroke-dashoffset:120}}@keyframes pulsePill{0%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.02)}}.orb-1{animation:floatOrb1 10s ease-in-out infinite}.orb-2{animation:floatOrb2 12s ease-in-out infinite}.stream-line{stroke-dasharray:8 12;animation:dashCycle 6s linear infinite}.pill-anim{transform-origin:center;animation:pulsePill 4s ease-in-out infinite}.sub-font,.title-font{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-font{font-weight:800}.sub-font{font-weight:500}.tag-font{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:600}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><g class="orb-1"><circle cx="220" cy="140" r="280" fill="url(#glowLeft)"/></g><g class="orb-2"><circle cx="980" cy="280" r="320" fill="url(#glowRight)"/></g><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 80 Q 300 20 600 80 T 1150 60" class="stream-line"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 50 360 Q 400 390 750 340 T 1150 360" class="stream-line" style="animation-direction:reverse"/><circle cx="600" cy="80" r="4" fill="#38bdf8"/><circle cx="750" cy="340" r="4" fill="#818cf8"/></g><g class="pill-anim" transform="translate(600, 65)"><rect width="360" height="36" x="-180" y="-18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" rx="18"/><circle cx="-152" cy="0" r="6" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.4;1;0.4"/></circle><text x="-136" y="5" fill="#e2e8f0" class="tag-font" font-size="13" letter-spacing="1">CURATED EXTENDED WORKFORCE ECOSYSTEM</text></g><g><text x="0" y="0" fill="url(#primaryGrad)" class="title-font" filter="url(#shadow)" font-size="46" letter-spacing="-.5" text-anchor="middle" transform="translate(600, 155)">Awesome Contingent Workforce</text><text x="0" y="52" fill="#fff" class="title-font" filter="url(#shadow)" font-size="44" letter-spacing="-.5" text-anchor="middle" transform="translate(600, 155)">Management (C