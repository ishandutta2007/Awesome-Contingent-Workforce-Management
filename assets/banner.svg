<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -25px) scale(1.15); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-35px, 30px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulsePill {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    .orb-1 { animation: floatOrb1 10s ease-in-out infinite; }
    .orb-2 { animation: floatOrb2 12s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8 12; animation: dashCycle 6s linear infinite; }
    .pill-anim { transform-origin: center; animation: pulsePill 4s ease-in-out infinite; }
    .title-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .sub-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .tag-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <g class="orb-1">
    <circle cx="220" cy="140" r="280" fill="url(#glowLeft)" />
  </g>
  <g class="orb-2">
    <circle cx="980" cy="280" r="320" fill="url(#glowRight)" />
  </g>

  <!-- Dynamic Animated Tech Circuit Lines (behind text) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50 80 Q 300 20 600 80 T 1150 60" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 50 360 Q 400 390 750 340 T 1150 360" fill="none" stroke="#818cf8" stroke-width="2" style="animation-direction: reverse;" />
    <circle cx="600" cy="80" r="4" fill="#38bdf8" />
    <circle cx="750" cy="340" r="4" fill="#818cf8" />
  </g>

  <!-- Foreground Content Container -->
  <!-- Top Badge / Category Pill -->
  <g transform="translate(600, 65)" class="pill-anim">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="-152" cy="0" r="6" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-136" y="5" fill="#e2e8f0" font-size="13" class="tag-font" letter-spacing="1">CURATED EXTENDED WORKFORCE ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title (Guaranteed in foreground with high contrast) -->
  <g transform="translate(600, 155)">
    <text x="0" y="0" text-anchor="middle" font-size="46" fill="url(#primaryGrad)" class="title-font" letter-spacing="-0.5" filter="url(#shadow)">
      Awesome Contingent Workforce
    </text>
    <text x="0" y="52" text-anchor="middle" font-size="44" fill="#ffffff" class="title-font" letter-spacing="-0.5" filter="url(#shadow)">
      Management (CWM &amp; VMS)
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 260)">
    <text x="0" y="0" text-anchor="middle" font-size="19" fill="#94a3b8" class="sub-font" letter-spacing="0.2">
      Enterprise SaaS Platforms • Open-Source VMS &amp; Direct Sourcing • SOW &amp; Contractor Compliance
    </text>
  </g>

  <!-- Dynamic Feature Badges at Bottom -->
  <g transform="translate(600, 335)">
    <!-- Pill 1: Enterprise VMS -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-16" width="170" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="0" y="6" text-anchor="middle" fill="#38bdf8" font-size="13" class="tag-font">🏢 Enterprise VMS</text>
    </g>

    <!-- Pill 2: Contractor Compliance -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-16" width="190" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="0" y="6" text-anchor="middle" fill="#a78bfa" font-size="13" class="tag-font">⚖️ SOW &amp; Compliance</text>
    </g>

    <!-- Pill 3: Open-Source Tools -->
    <g transform="translate(125, 0)">
      <rect x="-90" y="-16" width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="0" y="6" text-anchor="middle" fill="#34d399" font-size="13" class="tag-font">💻 Open-Source Repos</text>
    </g>

    <!-- Pill 4: Spend Analytics -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-16" width="170" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="0" y="6" text-anchor="middle" fill="#fbbf24" font-size="13" class="tag-font">📊 Spend Analytics</text>
    </g>
  </g>

  <!-- Sleek Border Framing -->
  <rect x="1" y="1" width="1198" height="418" rx="8" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
